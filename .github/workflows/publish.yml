name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # 注意：这里跑 verify（lint+test+scss+docs+build+verify:package），不跑 test:visual——
      # 视觉快照基线目前是 enterprise-chromium-win32 平台专属，Linux 必挂；
      # 视觉回归在发布前于 Windows 本地执行（pnpm test:visual）。跨平台基线在
      # 仓库 issue 里跟踪，补齐后本工作流再追加 playwright 步骤。
      - name: Verify release tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm verify
      - run: npm pack --dry-run --ignore-scripts
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
