name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level=moderate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: npm run support:check
      - run: pnpm verify
      - run: npm pack --dry-run --ignore-scripts
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24

  compatibility:
    name: Published baseline upgrade and coexistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm run compatibility:check -- --output compatibility-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-evidence
          path: compatibility-evidence
